name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Buildozer Docker imajı ile APK derle (lisansları otomatik kabul et)
        run: |
          yes | docker run --rm -i \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            kivy/buildozer android debug

      - name: APK'yı yükle (indirilebilir dosya olarak)
        uses: actions/upload-artifact@v4
        with:
          name: HizliMatematik-APK
          path: bin/*.apk
