name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem bağımlılıklarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            python3-virtualenv autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Buildozer kur
        run: pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: python-for-android'i indir ve venv/pip sorununu düzelt
        run: |
          git clone --depth 1 -b master https://github.com/kivy/python-for-android p4a-src
          python3 - << 'EOF'
          path = "p4a-src/pythonforandroid/build.py"
          with open(path) as f:
              content = f.read()

          old = """    with current_directory(join(ctx.build_dir)):
              shprint(host_python, '-m', 'venv', 'venv')

              # Prepare base environment and upgrade pip:
              base_env = dict(copy.copy(os.environ))
              base_env["PYTHONPATH"] = ctx.get_site_packages_dir(arch)
              info('Upgrade pip to latest version')
              shprint(sh.bash, '-c', (
                  "source venv/bin/activate && pip install -U pip"
              ), _env=copy.copy(base_env))"""

          new = """    with current_directory(join(ctx.build_dir)):
              shprint(sh.Command("virtualenv"), "--python", ctx.hostpython, "venv")

              # Prepare base environment and upgrade pip:
              base_env = dict(copy.copy(os.environ))
              base_env["PYTHONPATH"] = ctx.get_site_packages_dir(arch)
              info('Upgrade pip to latest version')
              shprint(sh.bash, '-c', (
                  "source venv/bin/activate && python -m pip install -U pip"
              ), _env=copy.copy(base_env))"""

          if old not in content:
              raise SystemExit("PATTERN NOT FOUND")

          content = content.replace(old, new)
          with open(path, "w") as f:
              f.write(content)
          print("Patched successfully")
          EOF

      - name: APK derle (lisansları otomatik kabul et)
        run: yes | buildozer -v android debug

      - name: APK'yı yükle (indirilebilir dosya olarak)
        uses: actions/upload-artifact@v4
        with:
          name: HizliMatematik-APK
          path: bin/*.apk
